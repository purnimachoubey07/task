<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Login Modal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        /* Modal Background */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        /* Modal Box */
        .modal-content {
            background: white;
            padding: 20px;
            width: 300px;
            border-radius: 8px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <button onclick="openModal()">Login</button>

    <!-- Accessible Modal -->
    <div class="modal" id="loginModal" role="dialog" aria-labelledby="dialogTitle" aria-modal="true">

        <div class="modal-content">

            <h2 id="dialogTitle">Login</h2>

            <form>
                <label for="username">Username:</label><br>
                <input type="text" id="username" aria-label="Enter your username" required>

                <label for="password">Password:</label><br>
                <input type="password" id="password" aria-label="Enter your password" required>

                <button type="submit">Login</button>
                <button type="button" onclick="closeModal()">Close</button>
            </form>

        </div>

    </div>

    <script>
        function openModal() {
            document.getElementById("loginModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("loginModal").style.display = "none";
        }
    </script>

</body>

</html>
