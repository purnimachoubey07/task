<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Admin Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .sidebar {
            min-height: 100vh;
            background: #343a40;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
        }

        .sidebar a:hover {
            background: #495057;
        }

        .card {
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin Dashboard</a>
        </div>
    </nav>

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-3">
                <h4 class="text-white mb-4">Menu</h4>

                <a href="#">🏠 Dashboard</a>
                <a href="#">👤 Users</a>
                <a href="#">📦 Products</a>
                <a href="#">📊 Reports</a>
                <a href="#">⚙ Settings</a>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">

                <h2 class="mb-4">Dashboard Overview</h2>

                <!-- Cards -->
                <div class="row g-4">

                    <div class="col-md-3">
                        <div class="card text-center shadow p-3">
                            <h5>Total Users</h5>
                            <h2>250</h2>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card text-center shadow p-3">
                            <h5>Products</h5>
                            <h2>120</h2>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card text-center shadow p-3">
                            <h5>Orders</h5>
                            <h2>85</h2>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card text-center shadow p-3">
                            <h5>Revenue</h5>
                            <h2>₹75K</h2>
                        </div>
                    </div>

                </div>

                <!-- Table -->
                <div class="card shadow mt-5">

                    <div class="card-header bg-primary text-white">
                        Recent Orders
                    </div>

                    <div class="card-body">

                        <table class="table table-bordered table-hover">

                            <thead class="table-dark">
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Status</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr>
                                    <td>101</td>
                                    <td>Amit</td>
                                    <td>Completed</td>
                                </tr>

                                <tr>
                                    <td>102</td>
                                    <td>Priya</td>
                                    <td>Pending</td>
                                </tr>

                                <tr>
                                    <td>103</td>
                                    <td>Rahul</td>
                                    <td>Delivered</td>
                                </tr>
                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
