<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        caption {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }

        thead {
            background-color: #4CAF50;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tfoot {
            background-color: #ddd;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Marks Dashboard</h1>

    <table>

        <!-- Table Caption -->
        <caption>Student Marks Report</caption>

        <!-- Table Header -->
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>HTML</th>
                <th>CSS</th>
                <th>JavaScript</th>
                <th>Total</th>
                <th>Grade</th>
            </tr>
        </thead>

        <!-- Table Body -->
        <tbody>
            <tr>
                <td>101</td>
                <td>Poornima</td>
                <td>90</td>
                <td>88</td>
                <td>92</td>
                <td>270</td>
                <td>A+</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Rahul</td>
                <td>85</td>
                <td>80</td>
                <td>78</td>
                <td>243</td>
                <td>A</td>
            </tr>

            <tr>
                <td>103</td>
                <td>Anjali</td>
                <td>95</td>
                <td>91</td>
                <td>89</td>
                <td>275</td>
                <td>A+</td>
            </tr>
        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="5">Class Average</td>
                <td>263</td>
                <td>A</td>
            </tr>
        </tfoot>

    </table>

</body>

</html>
