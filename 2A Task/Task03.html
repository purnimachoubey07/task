<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <h1>Student Registration Form</h1>

    <form>

        <!-- Name -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" aria-label="Enter your full name" required><br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" aria-label="Enter your email address" required><br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" aria-label="Enter your phone number" required><br><br>

        <!-- Gender -->
        <label for="gender">Gender:</label><br>
        <select id="gender" name="gender" aria-label="Select your gender">
            <option value="">--Select--</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select><br><br>

        <!-- Course -->
        <label for="course">Course:</label><br>
        <input type="text" id="course" name="course" aria-label="Enter your course"><br><br>

        <!-- Address -->
        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30" aria-label="Enter your address"></textarea><br><br>

        <!-- Submit Button -->
        <button type="submit" aria-label="Submit registration form">
            Register
        </button>

    </form>

</body>

</html>
