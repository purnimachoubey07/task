<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Form Validation</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fff5f8;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .form-container {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 16px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .form-container h2 {
            text-align: center;

            color: #222;

            margin-bottom: 8px;
        }

        .form-container .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 14px;

            font-weight: 600;
        }

        .form-group input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #ddd;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #e91e63;

            box-shadow: 0 0 0 3px rgba(233, 30, 99, 0.1);
        }

        .form-group input.valid {
            border-color: #22c55e;
        }

        .form-group input.invalid {
            border-color: #ef4444;
        }

        .message {
            display: block;

            margin-top: 6px;

            font-size: 13px;
        }

        .error {
            color: #ef4444;
        }

        .success {
            color: #22c55e;
        }

        .submit-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #e91e63;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #c2185b;
        }

    </style>

</head>


<body>


    <div class="form-container">

        <h2>Create Account</h2>

        <p class="subtitle">
            Fill in the details to create your account
        </p>


        <form id="myForm">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name">

                <span
                    class="message"
                    id="nameMessage">
                </span>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email">

                <span
                    class="message"
                    id="emailMessage">
                </span>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password">

                <span
                    class="message"
                    id="passwordMessage">
                </span>

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    Mobile Number
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter 10 digit mobile number">

                <span
                    class="message"
                    id="phoneMessage">
                </span>

            </div>


            <button
                type="submit"
                class="submit-btn">

                Create Account

            </button>


        </form>

    </div>



    <script>

        const form = document.getElementById("myForm");

        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const phoneInput = document.getElementById("phone");


        // =========================
        // NAME VALIDATION
        // =========================

        nameInput.addEventListener("input", function () {

            if (nameInput.value.trim() === "") {

                showError(
                    nameInput,
                    "nameMessage",
                    "Name is required"
                );

            } else if (nameInput.value.trim().length < 3) {

                showError(
                    nameInput,
                    "nameMessage",
                    "Name must contain at least 3 characters"
                );

            } else {

                showSuccess(
                    nameInput,
                    "nameMessage",
                    "Name is valid ✓"
                );

            }

        });


        // =========================
        // EMAIL VALIDATION
        // =========================

        emailInput.addEventListener("input", function () {

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (emailInput.value.trim() === "") {

                showError(
                    emailInput,
                    "emailMessage",
                    "Email is required"
                );

            } else if (!emailPattern.test(emailInput.value)) {

                showError(
                    emailInput,
                    "emailMessage",
                    "Enter a valid email address"
                );

            } else {

                showSuccess(
                    emailInput,
                    "emailMessage",
                    "Email is valid ✓"
                );

            }

        });


        // =========================
        // PASSWORD VALIDATION
        // =========================

        passwordInput.addEventListener("input", function () {

            if (passwordInput.value === "") {

                showError(
                    passwordInput,
                    "passwordMessage",
                    "Password is required"
                );

            } else if (passwordInput.value.length < 6) {

                showError(
                    passwordInput,
                    "passwordMessage",
                    "Password must contain at least 6 characters"
                );

            } else {

                showSuccess(
                    passwordInput,
                    "passwordMessage",
                    "Password is strong enough ✓"
                );

            }

        });


        // =========================
        // PHONE VALIDATION
        // =========================

        phoneInput.addEventListener("input", function () {

            const phonePattern = /^[0-9]{10}$/;

            if (phoneInput.value.trim() === "") {

                showError(
                    phoneInput,
                    "phoneMessage",
                    "Mobile number is required"
                );

            } else if (!phonePattern.test(phoneInput.value)) {

                showError(
                    phoneInput,
                    "phoneMessage",
                    "Enter a valid 10 digit number"
                );

            } else {

                showSuccess(
                    phoneInput,
                    "phoneMessage",
                    "Mobile number is valid ✓"
                );

            }

        });


        // =========================
        // SHOW ERROR
        // =========================

        function showError(input, messageId, message) {

            input.classList.add("invalid");
            input.classList.remove("valid");

            const messageElement =
                document.getElementById(messageId);

            messageElement.textContent = message;

            messageElement.className =
                "message error";

        }


        // =========================
        // SHOW SUCCESS
        // =========================

        function showSuccess(input, messageId, message) {

            input.classList.add("valid");
            input.classList.remove("invalid");

            const messageElement =
                document.getElementById(messageId);

            messageElement.textContent = message;

            messageElement.className =
                "message success";

        }


        // =========================
        // FORM SUBMIT
        // =========================

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            if (
                nameInput.classList.contains("valid") &&
                emailInput.classList.contains("valid") &&
                passwordInput.classList.contains("valid") &&
                phoneInput.classList.contains("valid")
            ) {

                alert("Form submitted successfully!");

            } else {

                alert("Please correct the errors first.");

            }

        });

    </script>


</body>

</html>
