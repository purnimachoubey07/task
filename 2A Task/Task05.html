<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Image Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: green;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        figure {
            border: 1px solid #ccc;
            padding: 10px;
            width: 250px;
        }

        img {
            width: 100%;
            height: 180px;
            border-radius: 5px;
        }

        figcaption {
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Nature Image Gallery</h1>

    <section class="gallery">

        <figure>
            <img src="https://wallpapercave.com/wp/wp5561684.jpg" alt="Snow-covered mountains under a clear blue sky">
            <figcaption>Beautiful Mountains</figcaption>
        </figure>

        <figure>
            <img src="https://getwallpapers.com/wallpaper/full/9/1/6/1060941-green-forest-wallpaper-1920x1080-pc.jpg"
                alt="Dense green forest with tall trees and sunlight">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://wallpaperaccess.com/full/183870.jpg"
                alt="Calm lake reflecting surrounding trees and mountains">
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure>
            <img src="https://images.pexels.com/photos/464327/pexels-photo-464327.jpeg?cs=srgb&dl=landscape-nature-water-464327.jpg&fm=jpg"
                alt="Large waterfall flowing over rocks into a river">
            <figcaption>Beautiful Waterfall</figcaption>
        </figure>

    </section>

</body>

</html>
