<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fetch API - User Data</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f3ff;
            color: #1e1b4b;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #581c87;
        }

        .header p {
            color: #6b7280;
            font-size: 16px;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            border: none;
            background: #7e22ce;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #6b21a8;
            transform: translateY(-2px);
        }

        #status {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .loading {
            color: #7e22ce;
        }

        .error {
            color: #dc2626;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .user-card {
            background: white;
            border: 1px solid #ddd6fe;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(88, 28, 135, 0.08);
            transition: 0.3s;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(88, 28, 135, 0.15);
        }

        .user-icon {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: #f3e8ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .user-card h2 {
            font-size: 20px;
            color: #581c87;
            margin-bottom: 15px;
        }

        .user-info {
            margin-bottom: 9px;
            color: #4b5563;
            font-size: 14px;
        }

        .user-info strong {
            color: #1f2937;
        }

        @media (max-width: 800px) {

            .users-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 550px) {

            .users-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }

        }

    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>👥 User Directory</h1>
            <p>Fetch user data from a public API using JavaScript</p>
        </div>

        <div class="controls">
            <button onclick="fetchUsers()">
                Fetch Users
            </button>
        </div>

        <div id="status"></div>

        <div id="usersContainer" class="users-grid"></div>

    </div>


    <script>

        // Public API URL
        const apiURL = "https://jsonplaceholder.typicode.com/users";


        // Function to fetch users
        async function fetchUsers() {

            const status = document.getElementById("status");
            const usersContainer = document.getElementById("usersContainer");

            // Show loading message
            status.textContent = "Loading users...";
            status.className = "loading";

            usersContainer.innerHTML = "";

            try {

                // Fetch data from API
                const response = await fetch(apiURL);

                // Check response
                if (!response.ok) {
                    throw new Error("Failed to fetch data");
                }

                // Convert response into JSON
                const users = await response.json();

                // Clear loading message
                status.textContent = `Successfully loaded ${users.length} users`;
                status.className = "";

                // Display users
                users.forEach(function(user) {

                    const card = document.createElement("div");

                    card.className = "user-card";

                    card.innerHTML = `
                        <div class="user-icon">👤</div>

                        <h2>${user.name}</h2>

                        <div class="user-info">
                            <strong>Username:</strong>
                            ${user.username}
                        </div>

                        <div class="user-info">
                            <strong>Email:</strong>
                            ${user.email}
                        </div>

                        <div class="user-info">
                            <strong>Phone:</strong>
                            ${user.phone}
                        </div>

                        <div class="user-info">
                            <strong>City:</strong>
                            ${user.address.city}
                        </div>

                        <div class="user-info">
                            <strong>Company:</strong>
                            ${user.company.name}
                        </div>
                    `;

                    usersContainer.appendChild(card);

                });

            }

            catch (error) {

                status.textContent = "❌ Error: Unable to fetch user data";
                status.className = "error";

                console.error(error);

            }

        }

        // Fetch data automatically when page loads
        fetchUsers();

    </script>

</body>

</html>
