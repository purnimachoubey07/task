<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Icons UI</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
        }

        .card {
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .icon {
            font-size: 40px;
            color: #0d6efd;
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-mortarboard-fill"></i> College Portal
            </a>
        </div>
    </nav>

    <div class="container my-5">

        <h2 class="text-center mb-4">Bootstrap Icons UI</h2>

        <div class="row g-4">

            <!-- Student Card -->
            <div class="col-md-4">
                <div class="card text-center shadow p-4">
                    <i class="bi bi-person-circle icon"></i>
                    <h4 class="mt-3">Student</h4>
                    <p>Manage student information easily.</p>
                    <button class="btn btn-primary">
                        <i class="bi bi-pencil-square"></i> Edit
                    </button>
                </div>
            </div>

            <!-- Courses Card -->
            <div class="col-md-4">
                <div class="card text-center shadow p-4">
                    <i class="bi bi-book-half icon"></i>
                    <h4 class="mt-3">Courses</h4>
                    <p>View available courses and subjects.</p>
                    <button class="btn btn-success">
                        <i class="bi bi-eye-fill"></i> View
                    </button>
                </div>
            </div>

            <!-- Settings Card -->
            <div class="col-md-4">
                <div class="card text-center shadow p-4">
                    <i class="bi bi-gear-fill icon"></i>
                    <h4 class="mt-3">Settings</h4>
                    <p>Update your account preferences.</p>
                    <button class="btn btn-danger">
                        <i class="bi bi-trash-fill"></i> Delete
                    </button>
                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
