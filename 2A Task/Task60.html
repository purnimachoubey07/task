<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Star Rating UI</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fffaf0;
            padding: 30px;
        }

        /* Main Card */

        .rating-card {
            width: 500px;
            background: #ffffff;
            padding: 45px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        /* Heading */

        .rating-card h1 {
            color: #c2410c;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        /* Stars */

        .stars {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .star {
            font-size: 48px;
            color: #d6d3d1;
            cursor: pointer;
            transition: 0.2s;
        }

        .star:hover {
            transform: scale(1.15);
            color: #f59e0b;
        }

        .star.active {
            color: #f59e0b;
        }

        /* Rating Text */

        #ratingText {
            color: #c2410c;
            font-size: 18px;
            font-weight: 600;
            min-height: 25px;
        }

        /* Submit Button */

        .submit-btn {
            margin-top: 25px;
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            background: #c2410c;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #9a3412;
        }

        /* Success Message */

        #message {
            display: none;
            margin-top: 18px;
            color: #c2410c;
            font-weight: 600;
        }

        /* Responsive */

        @media (max-width: 550px) {

            .rating-card {
                width: 100%;
                padding: 30px 20px;
            }

            .star {
                font-size: 40px;
            }

        }

    </style>

</head>


<body>


    <div class="rating-card">

        <h1>Rate Our Service</h1>

        <p class="subtitle">
            How would you rate your experience?
        </p>


        <!-- Star Rating -->

        <div class="stars">

            <span class="star" data-rating="1">★</span>

            <span class="star" data-rating="2">★</span>

            <span class="star" data-rating="3">★</span>

            <span class="star" data-rating="4">★</span>

            <span class="star" data-rating="5">★</span>

        </div>


        <!-- Rating Text -->

        <div id="ratingText">
            Select a rating
        </div>


        <!-- Submit -->

        <button
            class="submit-btn"
            id="submitBtn">
            Submit Rating
        </button>


        <!-- Message -->

        <div id="message">
            Thank you for your rating!
        </div>

    </div>



    <script>

        /* =========================
           SELECT ELEMENTS
        ========================== */

        const stars =
            document.querySelectorAll(".star");

        const ratingText =
            document.getElementById("ratingText");

        const submitBtn =
            document.getElementById("submitBtn");

        const message =
            document.getElementById("message");


        let selectedRating = 0;



        /* =========================
           STAR CLICK
        ========================== */

        stars.forEach(function (star) {

            star.addEventListener("click", function () {

                selectedRating =
                    Number(star.getAttribute("data-rating"));


                /* Update stars */

                stars.forEach(function (item) {

                    const rating =
                        Number(item.getAttribute("data-rating"));

                    if (rating <= selectedRating) {

                        item.classList.add("active");

                    } else {

                        item.classList.remove("active");

                    }

                });


                /* Update text */

                ratingText.textContent =
                    selectedRating + " out of 5 stars";


                message.style.display = "none";

            });

        });



        /* =========================
           SUBMIT RATING
        ========================== */

        submitBtn.addEventListener("click", function () {

            if (selectedRating === 0) {

                alert("Please select a rating first.");

                return;

            }


            message.style.display = "block";

        });

    </script>


</body>

</html>
