<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        .game {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 10px;
        }

        .card {
            width: 80px;
            height: 80px;
            background: #0d6efd;
            color: white;
            font-size: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
        }

        .card.open,
        .card.matched {
            background: #198754;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Memory Game</h2>

        <div class="game" id="game"></div>

    </div>

    <script>

        const symbols = ["🍎", "🍎", "🍌", "🍌", "🍇", "🍇", "🍒", "🍒"];

        symbols.sort(() => Math.random() - 0.5);

        const game = document.getElementById("game");

        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;

        symbols.forEach(symbol => {

            const card = document.createElement("div");
            card.className = "card";
            card.dataset.symbol = symbol;
            card.innerHTML = "?";

            card.onclick = function () {

                if (lockBoard || card.classList.contains("matched") || card === firstCard) {
                    return;
                }

                card.innerHTML = symbol;
                card.classList.add("open");

                if (firstCard == null) {

                    firstCard = card;

                }
                else {

                    secondCard = card;
                    lockBoard = true;

                    if (firstCard.dataset.symbol === secondCard.dataset.symbol) {

                        firstCard.classList.add("matched");
                        secondCard.classList.add("matched");

                        resetTurn();

                    }
                    else {

                        setTimeout(function () {

                            firstCard.innerHTML = "?";
                            secondCard.innerHTML = "?";

                            firstCard.classList.remove("open");
                            secondCard.classList.remove("open");

                            resetTurn();

                        }, 1000);

                    }

                }

            };

            game.appendChild(card);

        });

        function resetTurn() {

            firstCard = null;
            secondCard = null;
            lockBoard = false;

        }

    </script>

</body>

</html>
