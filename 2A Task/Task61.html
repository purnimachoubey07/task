<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom Dropdown Menu</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0fdfa;
            padding: 30px;
        }

        /* Main Card */

        .container {
            width: 500px;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        /* Heading */

        .container h1 {
            text-align: center;
            color: #0f766e;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* Dropdown */

        .dropdown {
            position: relative;
            width: 100%;
        }

        /* Dropdown Button */

        .dropdown-btn {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 1px solid #99f6e4;
            border-radius: 10px;
            background: #ffffff;
            color: #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .dropdown-btn:hover {
            border-color: #0f766e;
        }

        .dropdown-btn.active {
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.10);
        }

        /* Arrow */

        .arrow {
            font-size: 14px;
            color: #0f766e;
            transition: 0.3s;
        }

        .dropdown-btn.active .arrow {
            transform: rotate(180deg);
        }

        /* Dropdown Menu */

        .dropdown-menu {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            background: #ffffff;
            border: 1px solid #ccfbf1;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.10);
            overflow: hidden;

            opacity: 0;
            visibility: hidden;
            transform: translateY(-8px);

            transition: 0.25s;
            z-index: 10;
        }

        /* Show Dropdown */

        .dropdown-menu.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Options */

        .dropdown-option {
            padding: 14px 16px;
            color: #444;
            cursor: pointer;
            transition: 0.2s;
        }

        .dropdown-option:hover {
            background: #f0fdfa;
            color: #0f766e;
        }

        .dropdown-option.selected {
            background: #ccfbf1;
            color: #0f766e;
            font-weight: 600;
        }

        /* Selected Result */

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #f0fdfa;
            border-radius: 10px;
            text-align: center;
            color: #0f766e;
            font-weight: 600;
        }

        /* Responsive */

        @media (max-width: 550px) {

            .container {
                width: 100%;
                padding: 30px 20px;
            }

            .container h1 {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


    <div class="container">

        <h1>Choose Your Course</h1>

        <p class="subtitle">
            Select a course from the dropdown menu
        </p>


        <!-- Custom Dropdown -->

        <div class="dropdown">

            <!-- Dropdown Button -->

            <button
                class="dropdown-btn"
                id="dropdownBtn">

                <span id="selectedText">
                    Select a course
                </span>

                <span class="arrow">
                    ▼
                </span>

            </button>


            <!-- Dropdown Options -->

            <div
                class="dropdown-menu"
                id="dropdownMenu">

                <div
                    class="dropdown-option"
                    data-value="BCA">
                    BCA
                </div>

                <div
                    class="dropdown-option"
                    data-value="BBA">
                    BBA
                </div>

                <div
                    class="dropdown-option"
                    data-value="B.Tech">
                    B.Tech
                </div>

                <div
                    class="dropdown-option"
                    data-value="MCA">
                    MCA
                </div>

                <div
                    class="dropdown-option"
                    data-value="MBA">
                    MBA
                </div>

            </div>

        </div>


        <!-- Selected Result -->

        <div class="result" id="result">

            No course selected

        </div>

    </div>



    <script>

        /* =========================
           SELECT ELEMENTS
        ========================== */

        const dropdownBtn =
            document.getElementById("dropdownBtn");

        const dropdownMenu =
            document.getElementById("dropdownMenu");

        const selectedText =
            document.getElementById("selectedText");

        const result =
            document.getElementById("result");

        const options =
            document.querySelectorAll(".dropdown-option");



        /* =========================
           OPEN / CLOSE DROPDOWN
        ========================== */

        dropdownBtn.addEventListener("click", function (event) {

            event.stopPropagation();

            dropdownMenu.classList.toggle("show");

            dropdownBtn.classList.toggle("active");

        });



        /* =========================
           SELECT OPTION
        ========================== */

        options.forEach(function (option) {

            option.addEventListener("click", function () {

                const value =
                    option.getAttribute("data-value");


                /* Change button text */

                selectedText.textContent =
                    value;


                /* Change result */

                result.textContent =
                    "Selected Course: " + value;


                /* Remove selected from all options */

                options.forEach(function (item) {

                    item.classList.remove("selected");

                });


                /* Add selected to clicked option */

                option.classList.add("selected");


                /* Close dropdown */

                dropdownMenu.classList.remove("show");

                dropdownBtn.classList.remove("active");

            });

        });



        /* =========================
           CLOSE WHEN CLICK OUTSIDE
        ========================== */

        document.addEventListener("click", function () {

            dropdownMenu.classList.remove("show");

            dropdownBtn.classList.remove("active");

        });

    </script>


</body>

</html>
