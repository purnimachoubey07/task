<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Number Checker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 350px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Prime Number Checker</h2>

        <input type="number" id="number" placeholder="Enter a number">

        <button onclick="checkPrime()">
            Check
        </button>

        <p id="result"></p>

    </div>

    <script>

        function checkPrime() {

            let num = Number(document.getElementById("number").value);
            let result = document.getElementById("result");

            if (num < 2) {
                result.innerHTML = num + " is Not a Prime Number";
                result.style.color = "red";
                return;
            }

            let isPrime = true;

            for (let i = 2; i < num; i++) {

                if (num % i === 0) {
                    isPrime = false;
                    break;
                }

            }

            if (isPrime) {
                result.innerHTML = num + " is a Prime Number";
                result.style.color = "green";
            }
            else {
                result.innerHTML = num + " is Not a Prime Number";
                result.style.color = "red";
            }

        }

    </script>

</body>

</html>
