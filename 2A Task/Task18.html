<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Journey Timeline</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }

        /* Timeline */
        .timeline {
            position: relative;
            max-width: 700px;
            margin: auto;
        }

        /* Vertical Line */
        .timeline::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 0;
            width: 4px;
            height: 100%;
            background: #4CAF50;
            transform: translateX(-50%);
        }

        /* Timeline Item */
        .container {
            position: relative;
            width: 50%;
            padding: 20px 40px;
        }

        /* Circle */
        .container::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: #4CAF50;
            border: 4px solid white;
            border-radius: 50%;
            top: 25px;
            z-index: 1;
        }

        /* Left Side */
        .left {
            left: 0;
            text-align: right;
        }

        .left::after {
            right: -13px;
        }

        /* Right Side */
        .right {
            left: 50%;
        }

        .right::after {
            left: -13px;
        }

        /* Content Box */
        .content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .content h2 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h1>Student Journey Timeline</h1>

    <div class="timeline">

        <div class="container left">
            <div class="content">
                <h2>2024</h2>
                <p>Started BCA First Year.</p>
            </div>
        </div>

        <div class="container right">
            <div class="content">
                <h2>2025</h2>
                <p>Learned HTML, CSS, JavaScript, and Java.</p>
            </div>
        </div>

        <div class="container left">
            <div class="content">
                <h2>2026</h2>
                <p>Built Web Development and Java Projects.</p>
            </div>
        </div>

        <div class="container right">
            <div class="content">
                <h2>Future</h2>
                <p>Become a Software Developer.</p>
            </div>
        </div>

    </div>

</body>

</html>
