<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Color Theme</title>

    <style>
        /* CSS Variables */
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background-color: #f4f4f4;
            --text-color: #333333;
            --button-color: #e67e22;
            --button-hover: #d35400;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
        }

        /* Header */
        header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Main Content */
        main {
            padding: 20px;
        }

        .card {
            background: white;
            border: 2px solid var(--secondary-color);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        /* Button */
        button {
            background-color: var(--button-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--button-hover);
        }

        /* Footer */
        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Website Theme Using CSS Variables</p>
    </header>

    <main>

        <div class="card">
            <h2>Welcome</h2>
            <p>
                This webpage uses CSS variables defined in the
                <strong>:root</strong> selector to create a consistent color theme.
            </p>

            <button>Learn More</button>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 My Website | All Rights Reserved</p>
    </footer>

</body>

</html>
