<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Loading Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        button {
            padding: 12px 20px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0b5ed7;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Callback Loading Example</h2>

        <button onclick="startLoading()">
            Load Data
        </button>

        <p id="message"></p>

    </div>

    <script>

        // Function with Callback
        function loadData(callback) {

            document.getElementById("message").innerHTML = "Loading...";

            // Simulate asynchronous task
            setTimeout(function () {

                callback();

            }, 3000);

        }

        // Callback Function
        function showData() {

            document.getElementById("message").innerHTML =
                "Data Loaded Successfully!";

        }

        // Start Loading
        function startLoading() {

            loadData(showData);

        }

    </script>

</body>

</html>
