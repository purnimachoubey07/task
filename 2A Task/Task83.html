<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Error Handling</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ecfdf5;
            color: #064e3b;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            color: #047857;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
            font-size: 16px;
        }

        .button-area {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            background: #059669;
            color: white;
            border: none;
            padding: 13px 26px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #047857;
            transform: translateY(-2px);
        }

        /* Loading */

        #loader {
            display: none;
            text-align: center;
            margin: 30px 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #a7f3d0;
            border-top: 5px solid #059669;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        #loader p {
            margin-top: 12px;
            color: #047857;
            font-weight: bold;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        /* Error Box */

        #errorBox {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 25px auto;
            max-width: 600px;
        }

        #errorBox .error-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        #errorBox h2 {
            margin-bottom: 8px;
        }

        #errorBox p {
            color: #7f1d1d;
            margin-bottom: 15px;
        }

        .retry-btn {
            background: #dc2626;
            padding: 10px 20px;
        }

        .retry-btn:hover {
            background: #b91c1c;
        }

        /* Success */

        #successMessage {
            display: none;
            text-align: center;
            color: #047857;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* User Cards */

        .users-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .user-card {
            background: white;
            border: 1px solid #a7f3d0;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(6, 78, 59, 0.08);
            transition: 0.3s;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px rgba(6, 78, 59, 0.14);
        }

        .user-icon {
            width: 55px;
            height: 55px;
            background: #d1fae5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 15px;
        }

        .user-card h2 {
            color: #047857;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .user-info {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .user-info strong {
            color: #374151;
        }

        @media (max-width: 800px) {

            .users-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 550px) {

            .users-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="header">

            <h1>🛡️ API Error Handling</h1>

            <p>
                Handle API errors gracefully using JavaScript
            </p>

        </div>


        <div class="button-area">

            <button onclick="fetchUsers()">
                Load User Data
            </button>

        </div>


        <!-- Loading Spinner -->

        <div id="loader">

            <div class="spinner"></div>

            <p>Loading data...</p>

        </div>


        <!-- Error Message -->

        <div id="errorBox">

            <div class="error-icon">
                ⚠️
            </div>

            <h2>
                Something went wrong
            </h2>

            <p id="errorMessage">
                Unable to load data.
            </p>

            <button
                class="retry-btn"
                onclick="fetchUsers()">

                Try Again

            </button>

        </div>


        <!-- Success Message -->

        <div id="successMessage"></div>


        <!-- User Data -->

        <div
            id="usersContainer"
            class="users-grid">

        </div>

    </div>


    <script>

        const apiURL =
            "https://jsonplaceholder.typicode.com/users";


        async function fetchUsers() {

            const loader =
                document.getElementById("loader");

            const errorBox =
                document.getElementById("errorBox");

            const errorMessage =
                document.getElementById("errorMessage");

            const successMessage =
                document.getElementById("successMessage");

            const usersContainer =
                document.getElementById("usersContainer");


            // Reset previous messages

            errorBox.style.display = "none";

            successMessage.style.display = "none";

            usersContainer.innerHTML = "";


            // Show loader

            loader.style.display = "block";


            try {

                // API request

                const response =
                    await fetch(apiURL);


                // Handle HTTP errors

                if (!response.ok) {

                    throw new Error(
                        `Server Error: ${response.status}`
                    );

                }


                // Convert response to JSON

                const users =
                    await response.json();


                // Display users

                users.forEach(function(user) {

                    const card =
                        document.createElement("div");

                    card.className = "user-card";


                    card.innerHTML = `

                        <div class="user-icon">
                            👤
                        </div>

                        <h2>
                            ${user.name}
                        </h2>

                        <div class="user-info">
                            <strong>Username:</strong>
                            ${user.username}
                        </div>

                        <div class="user-info">
                            <strong>Email:</strong>
                            ${user.email}
                        </div>

                        <div class="user-info">
                            <strong>Phone:</strong>
                            ${user.phone}
                        </div>

                        <div class="user-info">
                            <strong>City:</strong>
                            ${user.address.city}
                        </div>

                        <div class="user-info">
                            <strong>Company:</strong>
                            ${user.company.name}
                        </div>

                    `;


                    usersContainer.appendChild(card);

                });


                // Success message

                successMessage.textContent =
                    `✓ ${users.length} users loaded successfully.`;

                successMessage.style.display = "block";

            }


            catch (error) {

                // Show user-friendly error

                errorMessage.textContent =
                    "Unable to load user data. Please check your internet connection and try again.";

                errorBox.style.display = "block";


                // Developer ke liye actual error

                console.error(
                    "API Error:",
                    error
                );

            }


            finally {

                // Hide loader

                loader.style.display = "none";

            }

        }


        // Load data automatically

        fetchUsers();

    </script>

</body>

</html>
