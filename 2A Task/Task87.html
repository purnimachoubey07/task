<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Infinite Scroll</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #ecfdf5;
            color: #064e3b;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            background: white;
            text-align: center;
            padding: 50px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .header h1 {
            font-size: 38px;
            color: #047857;
            margin-bottom: 12px;
        }

        .header p {
            color: #64748b;
            font-size: 17px;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }


        /* =========================
           USER GRID
        ========================= */

        .user-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }


        /* =========================
           USER CARD
        ========================= */

        .user-card {
            background: white;
            padding: 28px;
            border-radius: 18px;

            border: 1px solid #a7f3d0;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.06);

            transition: 0.3s;
        }

        .user-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.10);
        }


        /* =========================
           AVATAR
        ========================= */

        .avatar {
            width: 70px;
            height: 70px;

            border-radius: 50%;

            background: #d1fae5;
            color: #047857;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 26px;
            font-weight: bold;

            margin-bottom: 18px;
        }


        /* =========================
           USER TEXT
        ========================= */

        .user-card h3 {
            color: #065f46;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .username {
            color: #059669;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .user-info {
            color: #64748b;
            font-size: 14px;
            line-height: 1.9;
        }


        /* =========================
           LOADER
        ========================= */

        .loader {
            display: none;
            text-align: center;
            padding: 45px 20px;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border: 4px solid #a7f3d0;
            border-top-color: #059669;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: auto;
        }

        .loader p {
            margin-top: 14px;
            color: #64748b;
            font-size: 14px;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           ERROR
        ========================= */

        .error {
            display: none;

            background: #fef2f2;
            color: #b91c1c;

            padding: 15px;

            border-radius: 10px;

            margin-bottom: 25px;

            text-align: center;
        }


        /* =========================
           END MESSAGE
        ========================= */

        .end-message {
            display: none;

            text-align: center;

            background: white;

            border: 1px solid #a7f3d0;

            padding: 25px;

            margin-top: 25px;

            border-radius: 15px;

            color: #64748b;
        }

        .end-message strong {
            display: block;

            color: #047857;

            font-size: 17px;

            margin-bottom: 6px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .user-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 550px) {

            .header h1 {
                font-size: 30px;
            }

            .user-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 0 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">

        <h1>Infinite Scroll</h1>

        <p>
            Scroll down to automatically load more users
        </p>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <div
            class="error"
            id="errorMessage">
        </div>


        <!-- USER CARDS -->

        <div
            class="user-grid"
            id="userGrid">
        </div>


        <!-- LOADER -->

        <div
            class="loader"
            id="loader">

            <div class="spinner"></div>

            <p>
                Loading more users...
            </p>

        </div>


        <!-- OBSERVER TARGET -->

        <div
            id="scrollTarget"
            style="height: 1px;">
        </div>


        <!-- END MESSAGE -->

        <div
            class="end-message"
            id="endMessage">

            <strong>
                You've reached the end!
            </strong>

            <span>
                No more users are available.
            </span>

        </div>


    </main>


    <script>


        // =========================
        // API
        // =========================

        const apiURL =
            "https://jsonplaceholder.typicode.com/users";


        // =========================
        // ELEMENTS
        // =========================

        const userGrid =
            document.getElementById("userGrid");

        const loader =
            document.getElementById("loader");

        const errorMessage =
            document.getElementById("errorMessage");

        const scrollTarget =
            document.getElementById("scrollTarget");

        const endMessage =
            document.getElementById("endMessage");


        // =========================
        // VARIABLES
        // =========================

        let currentPage = 1;

        const usersPerPage = 3;

        let isLoading = false;

        let hasMoreUsers = true;


        // =========================
        // LOAD USERS FROM API
        // =========================

        async function loadUsers() {


            // Agar already loading hai
            if (isLoading) {
                return;
            }


            // Agar aur users nahi hain
            if (!hasMoreUsers) {
                return;
            }


            isLoading = true;

            loader.style.display = "block";


            try {


                // API request

                const response = await fetch(
                    `${apiURL}?_page=${currentPage}&_limit=${usersPerPage}`
                );


                if (!response.ok) {

                    throw new Error(
                        "Failed to fetch users"
                    );

                }


                const users =
                    await response.json();


                // Agar API ne empty array diya

                if (users.length === 0) {

                    hasMoreUsers = false;

                    endMessage.style.display =
                        "block";

                    return;

                }


                // Users ko page par add karo

                users.forEach(function(user) {

                    createUserCard(user);

                });


                // Next API page

                currentPage++;


                // Agar 3 se kam users aaye
                // matlab last page

                if (users.length < usersPerPage) {

                    hasMoreUsers = false;

                    endMessage.style.display =
                        "block";

                }


            }

            catch (error) {

                errorMessage.textContent =
                    "Unable to load users. Please try again.";

                errorMessage.style.display =
                    "block";

                console.error(error);

            }

            finally {

                isLoading = false;

                loader.style.display =
                    "none";

            }

        }


        // =========================
        // CREATE USER CARD
        // =========================

        function createUserCard(user) {


            const card =
                document.createElement("div");


            card.className =
                "user-card";


            const firstLetter =
                user.name
                    .charAt(0)
                    .toUpperCase();


            card.innerHTML = `

                <div class="avatar">
                    ${firstLetter}
                </div>

                <h3>
                    ${user.name}
                </h3>

                <div class="username">
                    @${user.username}
                </div>

                <div class="user-info">

                    📧 ${user.email}
                    <br>

                    📞 ${user.phone}
                    <br>

                    📍 ${user.address.city}

                </div>

            `;


            userGrid.appendChild(card);

        }


        // =========================
        // INTERSECTION OBSERVER
        // =========================

        const observer =
            new IntersectionObserver(
                function(entries) {

                    if (
                        entries[0].isIntersecting
                    ) {

                        loadUsers();

                    }

                },
                {
                    root: null,

                    rootMargin: "200px",

                    threshold: 0
                }
            );


        // Observer start

        observer.observe(scrollTarget);


        // =========================
        // FIRST API CALL
        // =========================

        loadUsers();


    </script>


</body>

</html>
