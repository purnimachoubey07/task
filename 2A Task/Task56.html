<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Show Hide Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0fdf4;
        }

        /* Login Card */
        .login-box {
            width: 520px;
            background: #ffffff;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.10);
        }

        /* Heading */
        .login-box h2 {
            text-align: center;
            color: #166534;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .login-box > p {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-bottom: 35px;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 9px;
            font-size: 17px;
            font-weight: 600;
            color: #222;
        }

        /* Email Input */
        .form-group > input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .form-group > input:focus {
            border-color: #166534;
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.10);
        }

        /* Password Wrapper */
        .input-box {
            position: relative;
            width: 100%;
        }

        /* Password Input */
        .input-box input {
            width: 100%;
            height: 52px;
            padding: 0 50px 0 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #166534;
            box-shadow: 0 0 0 3px rgba(22, 101, 52, 0.10);
        }

        /* Eye Button */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 20px;
            color: #166534;
            user-select: none;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: #166534;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #14532d;
            transform: translateY(-1px);
        }

        /* Success Message */
        .message {
            text-align: center;
            margin-top: 18px;
            color: #166534;
            font-weight: 600;
            display: none;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .login-box {
                width: 90%;
                padding: 30px 25px;
            }

            .login-box h2 {
                font-size: 28px;
            }

            .login-box > p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <p>Enter your login details</p>

        <form id="loginForm">

            <!-- Email -->
            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">Password</label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <span
                        class="toggle-password"
                        id="togglePassword">
                        👁️
                    </span>

                </div>

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="login-btn">
                Login
            </button>

            <div
                class="message"
                id="message">
                Login Successful!
            </div>

        </form>

    </div>


    <script>

        /* =========================
           SHOW / HIDE PASSWORD
        ========================= */

        const password =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        togglePassword.addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                togglePassword.textContent = "🙈";

            } else {

                password.type = "password";

                togglePassword.textContent = "👁️";

            }

        });


        /* =========================
           LOGIN FORM
        ========================= */

        const loginForm =
            document.getElementById("loginForm");

        const message =
            document.getElementById("message");


        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            message.style.display = "block";

        });

    </script>

</body>

</html>
