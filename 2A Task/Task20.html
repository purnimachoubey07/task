<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Toggle</title>

    <style>
        /* Light Theme */
        :root {
            --bg-color: #f4f4f4;
            --text-color: #222;
            --card-color: #ffffff;
            --button-color: #4CAF50;
        }

        /* Dark Theme */
        .dark-mode {
            --bg-color: #1e1e1e;
            --text-color: #ffffff;
            --card-color: #333333;
            --button-color: #ff9800;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            transition: 0.4s;
        }

        .container {
            width: 350px;
            margin: 80px auto;
            padding: 25px;
            background: var(--card-color);
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: 0.4s;
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            background: var(--button-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .toggle {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Dark Mode Demo</h1>

        <p>Click the toggle to switch between Light and Dark Mode.</p>

        <div class="toggle">
            <label>
                <input type="checkbox" id="themeToggle">
                Dark Mode
            </label>
        </div>

        <button>Explore</button>

    </div>

    <script>

        const toggle = document.getElementById("themeToggle");

        toggle.addEventListener("change", function () {

            document.body.classList.toggle("dark-mode");

        });

    </script>

</body>

</html>
