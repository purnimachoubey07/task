<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .carousel-item img {
            height: 500px;
            object-fit: cover;
        }

        .carousel-caption {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <!-- Carousel Start -->
    <div id="homeSlider" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicators -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#homeSlider" data-bs-slide-to="0" class="active"></button>

            <button type="button" data-bs-target="#homeSlider" data-bs-slide-to="1"></button>

            <button type="button" data-bs-target="#homeSlider" data-bs-slide-to="2"></button>
        </div>

        <!-- Slides -->
        <div class="carousel-inner">

            <!-- Slide 1 -->
            <div class="carousel-item active">
                <img src="https://www.abccampus.ca/wp-content/uploads/2024/01/5ce5db0a544807205ce869dedfbad9fa_large.jpeg"
                    class="d-block w-100" alt="College Campus">

                <div class="carousel-caption">
                    <h2>Welcome to ABC College</h2>
                    <p>Quality Education for a Bright Future</p>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="carousel-item">
                <img src="https://static.vecteezy.com/system/resources/previews/024/744/896/non_2x/a-modern-library-with-a-large-collection-of-textbooks-in-a-row-generated-by-ai-free-photo.jpg"
                    class="d-block w-100" alt="Library">

                <div class="carousel-caption">
                    <h2>Modern Library</h2>
                    <p>Explore Thousands of Books & Resources</p>
                </div>
            </div>

            <!-- Slide 3 -->
            <div class="carousel-item">
                <img src="https://i.pinimg.com/originals/54/1a/3a/541a3a5b8c605bfaa2edb31649673d13.jpg"
                    class="d-block w-100" alt="Students">

                <div class="carousel-caption">
                    <h2>Student Activities</h2>
                    <p>Learn, Grow and Achieve Together</p>
                </div>
            </div>

        </div>

        <!-- Previous Button -->
        <button class="carousel-control-prev" type="button" data-bs-target="#homeSlider" data-bs-slide="prev">

            <span class="carousel-control-prev-icon"></span>

        </button>

        <!-- Next Button -->
        <button class="carousel-control-next" type="button" data-bs-target="#homeSlider" data-bs-slide="next">

            <span class="carousel-control-next-icon"></span>

        </button>

    </div>
    <!-- Carousel End -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
