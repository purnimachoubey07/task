<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Collapsible Sidebar</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #25202a;
            color: white;
            position: fixed;
            top: 0;
            left: 0;
            padding-top: 60px;
            transition: 0.3s;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
        }

        .sidebar a:hover {
            background: #ff2f63;
        }

        /* Hide Sidebar */
        .sidebar.hide {
            margin-left: -250px;
        }

        /* Main Content */
        .content {
            margin-left: 250px;
            padding: 20px;
            transition: 0.3s;
        }

        .content.full {
            margin-left: 0;
        }
    </style>

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark" style="background: #ff2f63;">
        <div class="container-fluid">

            <button class="btn btn-light" id="toggleBtn">
                ☰ Menu
            </button>

            <span class="navbar-brand mb-0 h1">
                Admin Dashboard
            </span>

        </div>
    </nav>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">

        <a href="#">🏠 Dashboard</a>
        <a href="#">👤 Users</a>
        <a href="#">📚 Courses</a>
        <a href="#">📊 Reports</a>
        <a href="#">⚙ Settings</a>

    </div>

    <!-- Main Content -->
    <div class="content" id="content">

        <h2 style="color: #ff2f63;">Welcome</h2>

        <p>
            Click the <strong>Menu</strong> button to show or hide the sidebar.
        </p>

        <div class="card p-4 shadow">
            <h4 style="color: #ff2f63;">Dashboard Content</h4>
            <p>This is the main content area.</p>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("content");
        const button = document.getElementById("toggleBtn");

        button.addEventListener("click", function () {

            sidebar.classList.toggle("hide");
            content.classList.toggle("full");

        });

    </script>

</body>

</html>
