<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fdf6f0;
            padding: 40px 20px;
        }

        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading h1 {
            color: #991b1b;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #666;
        }


        /* =========================
           PRODUCTS
        ========================== */

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .product-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .product-icon {
            width: 80px;
            height: 80px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fee2e2;
            border-radius: 50%;
            font-size: 38px;
            margin-bottom: 18px;
        }

        .product-card h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .price {
            color: #991b1b;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .add-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #991b1b;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            background: #7f7f7f;
        }


        /* =========================
           CART
        ========================== */

        .cart {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 18px;
            margin-bottom: 20px;
        }

        .cart-header h2 {
            color: #991b1b;
        }

        .cart-count {
            background: #991b1b;
            color: white;
            padding: 7px 13px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }


        /* =========================
           CART ITEMS
        ========================== */

        .cart-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-icon {
            width: 60px;
            height: 60px;
            background: #fff1f2;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            color: #333;
            margin-bottom: 6px;
        }

        .cart-item-info p {
            color: #991b1b;
            font-weight: bold;
        }


        /* =========================
           QUANTITY
        ========================== */

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: #fee2e2;
            color: #991b1b;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .quantity button:hover {
            background: #fecaca;
        }

        .quantity span {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }


        /* =========================
           REMOVE BUTTON
        ========================== */

        .remove-btn {
            border: none;
            background: #fff1f2;
            color: #dc2626;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
        }

        .remove-btn:hover {
            background: #fee2e2;
        }


        /* =========================
           EMPTY CART
        ========================== */

        .empty-cart {
            text-align: center;
            padding: 35px;
            color: #777;
            display: none;
        }

        .empty-cart .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }


        /* =========================
           CART SUMMARY
        ========================== */

        .cart-summary {
            margin-top: 25px;
            margin-left: auto;
            width: 300px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: #555;
        }

        .summary-row.total {
            border-top: 2px solid #fee2e2;
            margin-top: 8px;
            padding-top: 15px;
            color: #991b1b;
            font-size: 21px;
            font-weight: bold;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 18px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #991b1b;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #7f1d1d;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 750px) {

            .products {
                grid-template-columns: 1fr;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .cart-summary {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             HEADING
        ========================== -->

        <div class="heading">

            <h1>Shopping Cart</h1>

            <p>
                Add products and manage your cart
            </p>

        </div>


        <!-- =========================
             PRODUCTS
        ========================== -->

        <div class="products">


            <!-- Product 1 -->

            <div class="product-card">

                <div class="product-icon">
                    🎧
                </div>

                <h3>Wireless Headphones</h3>

                <div class="price">
                    ₹1,999
                </div>

                <button
                    class="add-btn"
                    data-id="1"
                    data-name="Wireless Headphones"
                    data-price="1999"
                    data-icon="🎧">

                    Add to Cart

                </button>

            </div>


            <!-- Product 2 -->

            <div class="product-card">

                <div class="product-icon">
                    ⌚
                </div>

                <h3>Smart Watch</h3>

                <div class="price">
                    ₹2,499
                </div>

                <button
                    class="add-btn"
                    data-id="2"
                    data-name="Smart Watch"
                    data-price="2499"
                    data-icon="⌚">

                    Add to Cart

                </button>

            </div>


            <!-- Product 3 -->

            <div class="product-card">

                <div class="product-icon">
                    🎒
                </div>

                <h3>Travel Backpack</h3>

                <div class="price">
                    ₹1,499
                </div>

                <button
                    class="add-btn"
                    data-id="3"
                    data-name="Travel Backpack"
                    data-price="1499"
                    data-icon="🎒">

                    Add to Cart

                </button>

            </div>

        </div>



        <!-- =========================
             CART
        ========================== -->

        <div class="cart">


            <div class="cart-header">

                <h2>Your Cart</h2>

                <span
                    class="cart-count"
                    id="cartCount">
                    0 Items
                </span>

            </div>


            <!-- Cart Items -->

            <div id="cartItems"></div>


            <!-- Empty Cart -->

            <div
                class="empty-cart"
                id="emptyCart">

                <div class="icon">
                    🛒
                </div>

                <p>
                    Your cart is empty
                </p>

            </div>


            <!-- =========================
                 SUMMARY
            ========================== -->

            <div class="cart-summary">

                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="subtotal">
                        ₹0
                    </span>

                </div>


                <div class="summary-row">

                    <span>Delivery</span>

                    <span>
                        ₹50
                    </span>

                </div>


                <div class="summary-row total">

                    <span>Total</span>

                    <span id="total">
                        ₹0
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    id="checkoutBtn">

                    Proceed to Checkout

                </button>

            </div>

        </div>

    </div>



    <script>

        /* =========================
           CART ARRAY
        ========================== */

        let cart = [];



        /* =========================
           SELECT ELEMENTS
        ========================== */

        const cartItems =
            document.getElementById("cartItems");

        const cartCount =
            document.getElementById("cartCount");

        const subtotal =
            document.getElementById("subtotal");

        const total =
            document.getElementById("total");

        const emptyCart =
            document.getElementById("emptyCart");



        /* =========================
           ADD TO CART
        ========================== */

        const addButtons =
            document.querySelectorAll(".add-btn");


        addButtons.forEach(function (button) {

            button.addEventListener("click", function () {

                const id =
                    button.getAttribute("data-id");

                const name =
                    button.getAttribute("data-name");

                const price =
                    Number(button.getAttribute("data-price"));

                const icon =
                    button.getAttribute("data-icon");


                /* Check existing product */

                const existingProduct =
                    cart.find(function (item) {

                        return item.id === id;

                    });


                if (existingProduct) {

                    existingProduct.quantity++;

                } else {

                    cart.push({

                        id: id,
                        name: name,
                        price: price,
                        icon: icon,
                        quantity: 1

                    });

                }


                updateCart();

            });

        });



        /* =========================
           UPDATE CART
        ========================== */

        function updateCart() {

            cartItems.innerHTML = "";


            /* Empty Cart */

            if (cart.length === 0) {

                emptyCart.style.display = "block";

            } else {

                emptyCart.style.display = "none";

            }


            let totalItems = 0;
            let subtotalAmount = 0;


            /* Create Cart Items */

            cart.forEach(function (item) {

                totalItems += item.quantity;

                subtotalAmount +=
                    item.price * item.quantity;


                const cartItem =
                    document.createElement("div");

                cartItem.className = "cart-item";


                cartItem.innerHTML = `

                    <div class="cart-item-icon">
                        ${item.icon}
                    </div>

                    <div class="cart-item-info">

                        <h3>
                            ${item.name}
                        </h3>

                        <p>
                            ₹${item.price}
                        </p>

                    </div>

                    <div class="quantity">

                        <button
                            onclick="decreaseQuantity('${item.id}')">
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="increaseQuantity('${item.id}')">
                            +
                        </button>

                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem('${item.id}')">

                        Remove

                    </button>

                `;


                cartItems.appendChild(cartItem);

            });


            /* Update Count */

            cartCount.textContent =
                totalItems + " Items";


            /* Update Subtotal */

            subtotal.textContent =
                "₹" + subtotalAmount.toLocaleString("en-IN");


            /* Delivery */

            const delivery =
                cart.length > 0 ? 50 : 0;


            /* Update Total */

            const finalTotal =
                subtotalAmount + delivery;


            total.textContent =
                "₹" + finalTotal.toLocaleString("en-IN");

        }



        /* =========================
           INCREASE QUANTITY
        ========================== */

        function increaseQuantity(id) {

            const item =
                cart.find(function (product) {

                    return product.id === id;

                });


            if (item) {

                item.quantity++;

                updateCart();

            }

        }



        /* =========================
           DECREASE QUANTITY
        ========================== */

        function decreaseQuantity(id) {

            const item =
                cart.find(function (product) {

                    return product.id === id;

                });


            if (item) {

                item.quantity--;


                if (item.quantity <= 0) {

                    removeItem(id);

                } else {

                    updateCart();

                }

            }

        }



        /* =========================
           REMOVE ITEM
        ========================== */

        function removeItem(id) {

            cart =
                cart.filter(function (item) {

                    return item.id !== id;

                });


            updateCart();

        }



        /* =========================
           CHECKOUT
        ========================== */

        const checkoutBtn =
            document.getElementById("checkoutBtn");


        checkoutBtn.addEventListener("click", function () {

            if (cart.length === 0) {

                alert("Your cart is empty.");

                return;

            }


            alert("Order placed successfully!");

        });



        /* Initial Cart */

        updateCart();

    </script>


</body>

</html>
