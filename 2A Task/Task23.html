<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Pricing Table</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card {
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }
    </style>

</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center mb-5 fw-bold">
            Pricing Plans
        </h2>

        <div class="row g-4">

            <!-- Basic Plan -->
            <div class="col-md-4">
                <div class="card text-center shadow rounded-4 p-4 h-100">

                    <h3 class="text-primary">Basic</h3>

                    <h2 class="my-3">₹299<span class="fs-6">/month</span></h2>

                    <ul class="list-unstyled my-4">
                        <li class="mb-2">✔ 5 GB Storage</li>
                        <li class="mb-2">✔ 10 Users</li>
                        <li class="mb-2">✔ Email Support</li>
                    </ul>

                    <button class="btn btn-primary w-100">
                        Choose Plan
                    </button>

                </div>
            </div>

            <!-- Standard Plan -->
            <div class="col-md-4">
                <div class="card text-center shadow-lg rounded-4 p-4 h-100 border border-primary">

                    <h3 class="text-success">Standard</h3>

                    <h2 class="my-3">₹599<span class="fs-6">/month</span></h2>

                    <ul class="list-unstyled my-4">
                        <li class="mb-2">✔ 20 GB Storage</li>
                        <li class="mb-2">✔ 50 Users</li>
                        <li class="mb-2">✔ 24×7 Support</li>
                    </ul>

                    <button class="btn btn-success w-100">
                        Choose Plan
                    </button>

                </div>
            </div>

            <!-- Premium Plan -->
            <div class="col-md-4">
                <div class="card text-center shadow rounded-4 p-4 h-100">

                    <h3 class="text-danger">Premium</h3>

                    <h2 class="my-3">₹999<span class="fs-6">/month</span></h2>

                    <ul class="list-unstyled my-4">
                        <li class="mb-2">✔ 100 GB Storage</li>
                        <li class="mb-2">✔ Unlimited Users</li>
                        <li class="mb-2">✔ Priority Support</li>
                    </ul>

                    <button class="btn btn-danger w-100">
                        Choose Plan
                    </button>

                </div>
            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
